name: Weekly Fetch

on:
  schedule:
    # 每天 07:00 台北時間 = 前一天 23:00 UTC
    # TDCC 通常週六公布當週資料，但遇颱風假等會延後且無歷史檔可補，
    # 所以每天檢查；fetch_data.py 判斷資料庫已有同週資料就直接跳過上傳
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run (true/false)'
        required: false
        default: 'false'
      force:
        description: '強制上傳，跳過「資料已存在」檢查 (true/false)'
        required: false
        default: 'false'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Run fetcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          STOCK_INGEST_TOKEN: ${{ secrets.STOCK_INGEST_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python scripts/fetch_data.py $ARGS
