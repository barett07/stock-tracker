name: Weekly Fetch

on:
  schedule:
    # 每週六 07:00 台北時間 = 週五 23:00 UTC
    - cron: '0 23 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run (true/false)'
        required: false
        default: 'false'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Run fetcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          STOCK_INGEST_TOKEN: ${{ secrets.STOCK_INGEST_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/fetch_data.py $ARGS
